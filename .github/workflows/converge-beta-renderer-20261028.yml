name: Beta Renderer 20261028 Forward Convergence

on:
  workflow_dispatch:
    inputs:
      convergence_confirmation:
        description: Type CONVERGE BETA RENDERER 20261028
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: misechef-beta-deployment
  cancel-in-progress: false

jobs:
  converge-renderer:
    if: ${{ github.ref == 'refs/heads/main' && inputs.convergence_confirmation == 'CONVERGE BETA RENDERER 20261028' }}
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: b14f22f6fff00f332aed9d45508fbb257d3763b0
          path: candidate-source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate to Beta
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MISECHEF_BETA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Converge only the Beta Store renderer
        env:
          RECOVERY_CONFIRMATION: ${{ inputs.convergence_confirmation }}
          FIREBASE_DEPLOY_TARGET: beta
        run: node scripts/recoverBetaRendererForward20261028.mjs
