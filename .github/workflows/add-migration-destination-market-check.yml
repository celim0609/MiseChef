name: Add Migration Destination Market Check

on:
  push:
    branches:
      - migration/resolve-dry-run-blockers
    paths:
      - .github/workflows/add-migration-destination-market-check.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/resolve-dry-run-blockers
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add destination Store market verification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/migrateAuthorizedBetaBusiness.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = `  if (phase === 'post-apply' && getField(productionWorkspace, 'country') !== AUTHORIZED_MIGRATION_MARKET.country) {
            compatibilityBlockers.push(\`Production workspace country is not \${AUTHORIZED_MIGRATION_MARKET.country} after migration.\`);
          }
`;
          const after = `  if (phase === 'post-apply' && getField(productionWorkspace, 'country') !== AUTHORIZED_MIGRATION_MARKET.country) {
            compatibilityBlockers.push(\`Production workspace country is not \${AUTHORIZED_MIGRATION_MARKET.country} after migration.\`);
          }
          if (phase === 'post-apply') {
            const destinationStore = destinationDocuments
              .find(entry => entry.destinationPath === \`stores/\${DESTINATION.workspaceId}\`)?.document;
            try {
              assertAuthorizedSourceStoreMarket(destinationStore);
            } catch (error) {
              compatibilityBlockers.push(\`Production store market verification failed: \${error.message}\`);
            }
          }
`;
          const occurrences = source.split(before).length - 1;
          if (occurrences !== 1) throw new Error(`Expected one post-apply workspace market block, found ${occurrences}.`);
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - name: Run migration tests
        run: npm run test:authorized-beta-business-migration

      - name: Verify only migration script changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          echo "$changed"
          test "$changed" = " M scripts/migrateAuthorizedBetaBusiness.mjs"

      - name: Commit destination verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/migrateAuthorizedBetaBusiness.mjs
          git commit -m "Verify destination store market after migration"
          git push origin HEAD:migration/resolve-dry-run-blockers
