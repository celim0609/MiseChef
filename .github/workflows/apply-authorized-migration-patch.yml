name: Apply Authorized Migration Patch

on:
  push:
    branches:
      - migration/resolve-dry-run-blockers
    paths:
      - .github/workflows/apply-authorized-migration-patch.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/resolve-dry-run-blockers
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic migration patch
        run: node scripts/patchAuthorizedBetaBusinessMigrationCountry.mjs

      - name: Run migration unit tests
        run: node --test scripts/migrateAuthorizedBetaBusiness.test.mjs scripts/authorizedBetaBusinessMigrationCountry.test.mjs

      - name: Verify only migration script changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short)"
          echo "$changed"
          test "$changed" = " M scripts/migrateAuthorizedBetaBusiness.mjs"

      - name: Commit patched migration script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/migrateAuthorizedBetaBusiness.mjs
          git commit -m "Integrate MY migration country safety"
          git push origin HEAD:migration/resolve-dry-run-blockers
