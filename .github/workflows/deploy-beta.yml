name: Beta Default Bucket API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-beta-default-bucket:
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 5
    steps:
      - name: Authenticate to Beta only
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MISECHEF_BETA }}
          token_format: access_token

      - name: Query Beta default bucket API
        shell: bash
        env:
          DIAGNOSTIC_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const project = 'misechef-beta-fa4bf';
          const resourcePath = `projects/${project}/defaultBucket`;
          const expectedEmail = 'github-beta-deployer@misechef-beta-fa4bf.iam.gserviceaccount.com';
          const credentialPath = process.env.GOOGLE_GHA_CREDS_PATH;
          const accessToken = process.env.DIAGNOSTIC_ACCESS_TOKEN;

          if (!credentialPath || !accessToken) {
            throw new Error('Required diagnostic authentication context is unavailable.');
          }

          const credential = JSON.parse(fs.readFileSync(credentialPath, 'utf8'));
          const authenticatedServiceAccount = credential.client_email ?? null;
          if (authenticatedServiceAccount !== expectedEmail) {
            throw new Error('Authenticated service-account identity does not match the approved Beta deployer.');
          }

          const response = await fetch(
            `https://firebasestorage.googleapis.com/v1alpha/${resourcePath}`,
            { headers: { Authorization: `Bearer ${accessToken}` } },
          );
          const body = await response.json().catch(() => ({}));
          const rawMessage = typeof body?.error?.message === 'string'
            ? body.error.message
            : null;
          const sanitizedErrorMessage = rawMessage
            ? rawMessage.replace(/https?:\/\/\S+/g, '[url omitted]').slice(0, 1000)
            : null;

          console.log(JSON.stringify({
            httpStatus: response.status,
            googleApiErrorCode: body?.error?.code ?? null,
            googleApiErrorStatus: body?.error?.status ?? null,
            sanitizedErrorMessage,
            requestProject: project,
            requestResourcePath: resourcePath,
            authenticatedServiceAccount,
            responseContainsDefaultBucket: Boolean(body?.bucket?.name),
          }, null, 2));
          NODE
