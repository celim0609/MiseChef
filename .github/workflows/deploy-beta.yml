name: Beta Authentication Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-beta-auth:
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 5
    steps:
      - name: Authenticate to Beta only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MISECHEF_BETA }}

      - name: Confirm authenticated Beta identity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const expectedEmail = 'github-beta-deployer@misechef-beta-fa4bf.iam.gserviceaccount.com';
          const expectedProject = 'misechef-beta-fa4bf';
          const credentialPath = process.env.GOOGLE_GHA_CREDS_PATH;

          if (!credentialPath) {
            throw new Error('GOOGLE_GHA_CREDS_PATH is unavailable.');
          }

          const credential = JSON.parse(fs.readFileSync(credentialPath, 'utf8'));
          const actualEmail = credential.client_email ?? null;
          const actualProject = credential.project_id ?? null;
          const emailMatches = actualEmail === expectedEmail;
          const projectMatches = actualProject === expectedProject;

          console.log(JSON.stringify({
            authenticatedServiceAccount: actualEmail,
            effectiveProject: actualProject,
            expectedServiceAccount: expectedEmail,
            expectedProject,
            emailMatches,
            projectMatches,
          }, null, 2));

          if (!emailMatches || !projectMatches) {
            process.exitCode = 1;
          }
          NODE
