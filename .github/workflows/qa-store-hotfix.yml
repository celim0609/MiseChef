name: Isolated Store Hotfix QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOTFIX_SHA: a00cd7fd7d16d3e898bc2e763619d526e5b849e1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: controller
      - uses: actions/checkout@v4
        with:
          ref: a00cd7fd7d16d3e898bc2e763619d526e5b849e1
          persist-credentials: false
          path: candidate
      - name: Verify candidate
        run: test "$(git -C candidate rev-parse HEAD)" = "$HOTFIX_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install candidate and QA dependencies
        run: |
          npm --prefix candidate ci
          npm --prefix candidate/functions ci
          npm install --prefix "$RUNNER_TEMP/store-qa-tools" --no-save firebase-tools@14.22.0 playwright@1.58.2
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/store-qa-tools/browsers" "$RUNNER_TEMP/store-qa-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run isolated authenticated browser QA
        run: |
          export QA_TOOLS="$RUNNER_TEMP/store-qa-tools"
          bash controller/scripts/store-hotfix-qa/run.sh "$PWD/candidate" "$RUNNER_TEMP/store-hotfix-evidence"
      - name: Retain sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-hotfix-qa
          path: ${{ runner.temp }}/store-hotfix-evidence
          retention-days: 3
          if-no-files-found: ignore
