name: Beta Mixed Release 20260924 Recovery

on:
  workflow_dispatch:
    inputs:
      recovery_confirmation:
        description: Type RECOVER BETA MIXED RELEASE 20260924 to authorize this exact incident recovery
        required: true
        type: string
      expected_candidate_sha:
        description: Exact immutable recovery candidate SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: misechef-beta-deployment
  cancel-in-progress: false

jobs:
  recover-beta-mixed-release:
    if: ${{ inputs.recovery_confirmation == 'RECOVER BETA MIXED RELEASE 20260924' && inputs.expected_candidate_sha == '41b331b95e5354e14bf28a70c4f28e1578ab8d32' }}
    runs-on: ubuntu-latest
    environment: beta
    timeout-minutes: 60
    env:
      FIREBASE_DEPLOY_TARGET: beta
      MISECHEF_BETA_PROTECTED_BASELINE: ${{ vars.MISECHEF_BETA_PROTECTED_BASELINE }}
      MISECHEF_BETA_CI_LOCK_ID: misechef-beta-deployment
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out protected mixed-release controller
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.MISECHEF_BETA_MIXED_RELEASE_20260924_GATE_SHA }}
          path: recovery-gate
          fetch-depth: 0

      - name: Check out immutable trusted Beta gate
        uses: actions/checkout@v4
        with:
          ref: 9c2173b9f9ae42b1fc09826c57cef46697759452
          path: trusted-gate
          fetch-depth: 0

      - name: Check out exact immutable recovery candidate
        uses: actions/checkout@v4
        with:
          ref: 41b331b95e5354e14bf28a70c4f28e1578ab8d32
          path: candidate
          fetch-depth: 0

      - name: Verify exact protected controller and candidate SHAs
        env:
          EXPECTED_GATE_SHA: ${{ vars.MISECHEF_BETA_MIXED_RELEASE_20260924_GATE_SHA }}
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/recovery-gate" rev-parse HEAD)" = "$EXPECTED_GATE_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse HEAD)" = "${{ inputs.expected_candidate_sha }}"
          test "$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse HEAD^{tree})" = "d298e5b1eee4a60ade64e10e27fd5da1965481c1"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 for mandatory Firebase Rules emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install protected controller dependencies
        run: npm --prefix "$GITHUB_WORKSPACE/recovery-gate" ci

      - name: Install immutable trusted gate dependencies
        run: npm --prefix "$GITHUB_WORKSPACE/trusted-gate" ci

      - name: Install exact candidate application dependencies
        run: npm --prefix "$GITHUB_WORKSPACE/candidate" ci

      - name: Install exact candidate Functions dependencies
        run: npm --prefix "$GITHUB_WORKSPACE/candidate/functions" ci

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@14.22.0

      - name: Validate protected mixed-release controller
        run: |
          npm --prefix "$GITHUB_WORKSPACE/recovery-gate" run test:beta-deployment-safety
          node --test "$GITHUB_WORKSPACE/recovery-gate/scripts/betaMixedReleaseRecovery.test.mjs"

      - name: Validate exact candidate with immutable trusted gate
        run: >-
          node "$GITHUB_WORKSPACE/trusted-gate/scripts/validateBetaReleaseBaseline.mjs"
          --trusted-root "$GITHUB_WORKSPACE/trusted-gate"
          --candidate-root "$GITHUB_WORKSPACE/candidate"

      - name: Run complete immutable trusted candidate regression gate
        run: >-
          node "$GITHUB_WORKSPACE/trusted-gate/scripts/runBetaProtectedTests.mjs"
          --trusted-root "$GITHUB_WORKSPACE/trusted-gate"
          --candidate-root "$GITHUB_WORKSPACE/candidate"

      - name: Run Store Sets Firestore authorization suite
        run: npm --prefix "$GITHUB_WORKSPACE/candidate" run test:store-sets:rules

      - name: Authenticate to Beta only
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MISECHEF_BETA }}

      - name: Run protected mixed-release convergence
        working-directory: recovery-gate
        env:
          MISECHEF_BETA_MIXED_RELEASE_20260924_GATE_SHA: ${{ vars.MISECHEF_BETA_MIXED_RELEASE_20260924_GATE_SHA }}
          MISECHEF_BETA_MIXED_RELEASE_20260924_CONFIRMATION: ${{ inputs.recovery_confirmation }}
          MISECHEF_BETA_MIXED_RELEASE_20260924_AUTHORIZATION: ${{ secrets.MISECHEF_BETA_MIXED_RELEASE_20260924_AUTHORIZATION }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
        run: node scripts/recoverBetaMixedRelease.mjs --candidate-root "$GITHUB_WORKSPACE/candidate"
