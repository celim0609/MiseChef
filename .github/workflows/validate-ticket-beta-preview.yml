name: Protected Ticket Beta Preview
on:
  workflow_dispatch:
    inputs:
      expected_candidate_sha:
        description: Exact environment-approved Ticket-only Production descendant
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: misechef-ticket-beta-preview
  cancel-in-progress: false
jobs:
  validate-and-preview:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_DEPLOY_TARGET: beta
      EXPECTED_SHA: ${{ inputs.expected_candidate_sha }}
      MISECHEF_TICKET_PREVIEW_APPROVED_SHA: ${{ vars.MISECHEF_TICKET_PREVIEW_APPROVED_SHA }}
      MISECHEF_TICKET_PRODUCTION_BASELINE: ${{ vars.MISECHEF_TICKET_PRODUCTION_BASELINE }}
      MISECHEF_BETA_PROTECTED_BASELINE: ${{ vars.MISECHEF_BETA_PROTECTED_BASELINE }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9c2173b9f9ae42b1fc09826c57cef46697759452
          path: trusted-gate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test protected preview scope guard
        run: node --test controller/scripts/ticketBetaPreviewSafety.test.mjs
      - name: Require exact approved Ticket-only scope and live Production ancestry
        run: node controller/scripts/ticketBetaPreviewSafety.mjs --candidate-root candidate
      - name: Install trusted gate dependencies
        run: npm --prefix trusted-gate ci
      - name: Install candidate dependencies
        run: npm --prefix candidate ci && npm --prefix candidate/functions ci
      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@14.22.0
      - name: Run immutable candidate baseline validation
        run: node trusted-gate/scripts/validateBetaReleaseBaseline.mjs --trusted-root trusted-gate --candidate-root candidate
      - name: Run complete immutable regression gate
        run: node trusted-gate/scripts/runBetaProtectedTests.mjs --trusted-root trusted-gate --candidate-root candidate
      - name: Run Store Sets authorization suite
        run: npm --prefix candidate run test:store-sets:rules
      - name: Build exact candidate for isolated Beta validation
        working-directory: candidate
        run: npm run validate:firebase-env:beta && npx vite build --mode beta
      - name: Prepare isolated static preview and fingerprint
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root = path.resolve('candidate');
          const authority = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'ticket-preview-authority.json')));
          const html = fs.readFileSync(path.join(root, 'dist/index.html'), 'utf8');
          const entryAsset = html.match(/src="(\/assets\/[^\"]+\.js)"/)[1];
          const sha256 = crypto.createHash('sha256').update(fs.readFileSync(path.join(root, 'dist', entryAsset.slice(1)))).digest('hex');
          fs.writeFileSync(path.join(root, 'dist/ticket-validation.json'), JSON.stringify({ kind: 'misechef-ticket-beta-preview', ...authority, entryAsset, entryAssetSha256: sha256 }, null, 2));
          fs.writeFileSync(path.join(root, 'firebase.ticket-preview.json'), JSON.stringify({ hosting: { site: 'misechef-beta-fa4bf', public: 'dist', ignore: ['firebase.ticket-preview.json', '**/.*', '**/node_modules/**'], headers: [{ source: '**', headers: [{ key: 'Cache-Control', value: 'no-store' }] }], rewrites: [{ source: '**', destination: '/index.html' }] } }));
          JS
      - name: Authenticate only for isolated Beta preview deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MISECHEF_BETA }}
      - name: Deploy expiring preview channel only
        working-directory: candidate
        run: |
          firebase hosting:channel:deploy "ticket-${EXPECTED_SHA:0:12}" --expires 1d --project misechef-beta-fa4bf --config firebase.ticket-preview.json --json > "$RUNNER_TEMP/ticket-preview-deployment.json"
          cat "$RUNNER_TEMP/ticket-preview-deployment.json"
      - name: Require main Beta release fingerprint to remain unchanged
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const before = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'ticket-preview-authority.json')));
          const r = await fetch('https://misechef-beta-fa4bf.web.app/.well-known/misechef-beta-release.json', { cache: 'no-store', signal: AbortSignal.timeout(30000) });
          if (!r.ok) throw new Error('Cannot verify main Beta release');
          const after = await r.json();
          if (before.betaLiveCommit !== after.sourceCommit || before.betaLiveAsset !== after.entryAsset) throw new Error('Main Beta changed during isolated validation');
          console.log('Main Beta release unchanged. Preview requires live UI QA before Production authority can advance.');
          JS
      - name: Save exact preview authority, URL and asset proof
        uses: actions/upload-artifact@v4
        with:
          name: ticket-beta-preview-${{ inputs.expected_candidate_sha }}
          path: |
            candidate/dist/ticket-validation.json
            ${{ runner.temp }}/ticket-preview-deployment.json
          if-no-files-found: error
