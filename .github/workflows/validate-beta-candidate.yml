name: Temporary POS Exact Candidate Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: misechef-pos-acceptance-once
  cancel-in-progress: false
jobs:
  isolated-ui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ec830441bd56f8929e5629da8eead4029457930e
          path: integration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 99448d0b2e3d2cf15df7d8249b52c5403341b020
          path: rollback
          persist-credentials: false
      - name: Prepare credential-free exact source archives
        run: python3 harness/qa/pos-acceptance/prepare.py
      - name: Install pinned dependencies before isolation
        run: |
          docker pull mcr.microsoft.com/playwright:v1.56.1-noble
          base=$(docker image inspect mcr.microsoft.com/playwright:v1.56.1-noble --format '{{index .RepoDigests 0}}')
          mkdir -p evidence
          printf '%s\n' "$base" > evidence/base-image-digest.txt
          docker build --build-arg BASE_IMAGE="$base" -t misechef-pos-acceptance:once context
      - name: Prove isolation and execute one acceptance run
        run: |
          docker run --user "$(id -u):$(id -g)" --name misechef-pos-acceptance-once --network none --read-only --cap-drop ALL --security-opt no-new-privileges --ipc private --shm-size 1g --memory 7g --cpus 2 --tmpfs /tmp:rw,nosuid,size=2g --tmpfs /run:rw,nosuid,size=16m --mount type=bind,src="$GITHUB_WORKSPACE/evidence",dst=/evidence --env HOME=/tmp/home --env TMPDIR=/tmp --env CI=true --env GCLOUD_PROJECT=demo-misechef-preview --env GOOGLE_CLOUD_PROJECT=demo-misechef-preview --env FIREBASE_EMULATORS_PATH=/opt/emulators misechef-pos-acceptance:once
      - name: Record container isolation and destroy runtime
        if: always()
        run: |
          docker inspect misechef-pos-acceptance-once --format '{{json .HostConfig.NetworkMode}} {{json .HostConfig.ReadonlyRootfs}} {{json .HostConfig.CapDrop}} {{json .Mounts}}' > evidence/container-isolation.txt 2>/dev/null || true
          docker rm -f misechef-pos-acceptance-once 2>/dev/null || true
          docker image rm -f misechef-pos-acceptance:once 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-pos-acceptance-evidence
          path: evidence
          retention-days: 14
